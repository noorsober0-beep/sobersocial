<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0806">
  <title>Sober Social — Dating Reimagined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-espresso: #2B1D16;
      --color-terracotta: #C46231;
      --color-terracotta-hover: #D86F3A;
      --color-linen: #F5EFE0;
      --bg-dark: #0D0806;
      --glass-border: rgba(245, 239, 224, 0.18);
      --glass-bg-track: rgba(43, 29, 22, 0.60);
      --glass-bg-capsule: rgba(196, 98, 49, 0.35);
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: var(--bg-dark);
      color: var(--color-linen);
      font-family: 'Manrope', system-ui, sans-serif;
    }
    ::selection { background: rgba(196, 98, 49, 0.4); color: var(--color-linen); }
    :focus-visible { outline: 2px solid var(--color-terracotta); outline-offset: 3px; }
    button, input { font: inherit; }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
    }
    .stage::after {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      content: '';
      background: radial-gradient(circle at 50% 35%, transparent 22%, rgba(13, 8, 6, .2) 75%),
        linear-gradient(to bottom, rgba(13, 8, 6, .55), transparent 26%, transparent 68%, rgba(13, 8, 6, .82));
    }
    .media {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      visibility: hidden;
    }
    .media.is-active { visibility: visible; }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      width: 100%;
      padding: calc(36px + env(safe-area-inset-top)) 40px 32px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--color-linen);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .14em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .brand-mark { width: 31px; height: 30px; flex: none; }
    .meta {
      display: flex;
      justify-content: center;
      gap: 22px;
      color: rgba(245, 239, 224, .72);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .join-button {
      display: inline-grid;
      width: 152px;
      height: 38px;
      place-items: center;
      border: 1px solid rgba(245, 239, 224, .35);
      border-radius: 999px;
      color: var(--color-linen);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      transition: background 240ms var(--retake-ease), border-color 240ms var(--retake-ease);
    }
    .join-button:hover { border-color: var(--color-terracotta); background: rgba(196, 98, 49, .3); }

    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      flex-direction: column;
      pointer-events: none;
    }
    .hero-copy {
      width: min(1050px, calc(100% - 40px));
      margin-top: clamp(150px, 22vh, 215px);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(48px, 5.5vw, 82px);
      font-weight: 600;
      letter-spacing: -.045em;
      line-height: 1.04;
      text-shadow: 0 10px 30px rgba(0, 0, 0, .65);
    }
    h1 span {
      display: inline-block;
      transition: filter 780ms var(--retake-ease), opacity 780ms var(--retake-ease), transform 780ms var(--retake-ease);
    }
    .title-hidden h1 span { filter: blur(12px); opacity: 0; transform: translateY(-12px); }
    h1 span:nth-child(2) { transition-delay: 25ms; }
    h1 span:nth-child(3) { transition-delay: 50ms; }
    h1 span:nth-child(4) { transition-delay: 75ms; }
    h1 span:nth-child(5) { transition-delay: 100ms; }
    h1 span:nth-child(6) { transition-delay: 125ms; }
    .hero-copy p {
      max-width: 500px;
      margin: 24px auto 0;
      color: rgba(245, 239, 224, .8);
      font-size: clamp(14px, 1.25vw, 17px);
      line-height: 1.7;
    }
    .waitlist {
      position: absolute;
      top: 53%;
      width: min(520px, calc(100% - 40px));
      pointer-events: auto;
    }
    .waitlist-form {
      display: flex;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: rgba(43, 29, 22, .6);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .2);
      backdrop-filter: blur(14px) saturate(130%);
      transition: box-shadow 240ms var(--retake-ease), border-color 240ms var(--retake-ease);
    }
    .waitlist-form:focus-within {
      border-color: rgba(196, 98, 49, .72);
      box-shadow: 0 0 0 4px rgba(196, 98, 49, .13), 0 18px 45px rgba(0, 0, 0, .25);
    }
    .waitlist-form input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 11px 17px;
      color: var(--color-linen);
      background: transparent;
      font-size: 14px;
    }
    .waitlist-form input::placeholder { color: rgba(245, 239, 224, .55); }
    .waitlist-form button {
      flex: none;
      border: 0;
      border-radius: 999px;
      padding: 0 22px;
      color: var(--color-linen);
      background: var(--color-terracotta);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      transition: background 240ms var(--retake-ease);
    }
    .waitlist-form button:hover { background: var(--color-terracotta-hover); }
    .waitlist-form button:disabled { cursor: wait; opacity: .7; }
    .success-badge, .error-message {
      padding: 19px 24px;
      border: 1px solid rgba(196, 98, 49, .55);
      border-radius: 999px;
      background: rgba(43, 29, 22, .78);
      text-align: center;
      font-size: 13px;
      backdrop-filter: blur(14px);
    }
    .error-message { border-color: rgba(220, 112, 72, .55); }

    .controller {
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
      --glass-x: 50%;
      --glass-y: 50%;
      position: absolute;
      top: 78%;
      left: 50%;
      z-index: 20;
      width: min(760px, calc(100% - 64px));
      height: 56px;
      transform: translateX(-50%);
    }
    .track {
      position: absolute;
      top: 4px;
      inset-inline: 0;
      height: 48px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass-bg-track);
      backdrop-filter: blur(12px) saturate(130%) contrast(108%);
      transition: opacity 620ms var(--retake-ease);
    }
    .track::after, .capsule::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: '';
      border-radius: inherit;
      background: radial-gradient(circle at var(--glass-x) var(--glass-y), rgba(245, 239, 224, .17), transparent 34%);
    }
    .capsule {
      position: absolute;
      top: -1px;
      left: var(--cap-left);
      width: var(--cap-width);
      height: 56px;
      border: 1px solid rgba(245, 239, 224, .4);
      border-radius: 999px;
      background: var(--glass-bg-capsule);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      pointer-events: none;
      transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease);
      backdrop-filter: blur(12px) saturate(130%);
    }
    .controller.is-selected .track { opacity: .2; }
    .controller.is-selected .capsule { left: 50%; width: 180px; transform: translateX(-50%); }
    .controller-grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 100%;
    }
    .controller-grid > * {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 0 9px;
      color: rgba(245, 239, 224, .78);
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .03em;
      text-align: center;
      transition: color 240ms var(--retake-ease);
    }
    .controller-grid > *:hover, .controller-grid > .is-reset { color: var(--color-linen); }
    .controller-grid .state-label { cursor: default; color: var(--color-linen); }
    .controller-grid button:disabled { cursor: not-allowed; opacity: .42; }
    .controller-grid .is-reset { color: var(--color-terracotta-hover); text-decoration: underline; text-underline-offset: 4px; }
    .sr-status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      .header { padding-inline: 24px; }
      .meta { gap: 10px; font-size: 10px; }
      .controller-grid > * { padding-inline: 5px; font-size: 10px; }
    }
    @media (max-width: 700px) {
      .header { padding: calc(22px + env(safe-area-inset-top)) 18px 20px; }
      .brand { gap: 8px; font-size: 12px; }
      .brand-mark { width: 25px; height: 25px; }
      .meta { display: none; }
      .join-button { width: 124px; height: 35px; font-size: 11px; }
      .hero-copy { margin-top: 140px; }
      h1 { font-size: clamp(44px, 12vw, 66px); line-height: 1.08; }
      .hero-copy p { max-width: 330px; margin-top: 18px; font-size: 13px; }
      .waitlist { top: 52%; }
      .waitlist-form { display: grid; border-radius: 24px; padding: 8px; }
      .waitlist-form button { min-height: 42px; }
      .controller { top: auto; bottom: 8px; width: calc(100% - 48px); height: 92px; }
      .track { top: 0; height: 92px; border-radius: 20px; }
      .capsule { top: 0; height: 46px; border-radius: 16px; }
      .controller-grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
      .controller-grid .state-label { grid-column: 1 / -1; }
      .controller.is-selected .capsule { left: 50%; width: calc(50% - 2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage">
    <video class="media is-active" id="video-1" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-1-reverse" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-2" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-2-reverse" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-3" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-3-reverse" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-4" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    <video class="media" id="video-4-reverse" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4" muted playsinline preload="auto" aria-hidden="true"></video>

    <header class="header">
      <a class="brand" href="/" aria-label="Sober Social home">
        <svg class="brand-mark" viewBox="0 0 42 40" aria-hidden="true">
          <path fill="#2B1D16" d="M2 3h18l-5.1 13.2c-.5 1.3-1.3 2.4-2.4 3.3V34h4v3H5v-3h4V19.5c-1.1-.9-1.9-2-2.4-3.3L2 3Z"/>
          <path fill="#C46231" d="M19 3h20l-5.7 13.8c-.6 1.4-1.5 2.6-2.7 3.5V34h4v3H23v-3h4V20.3c-1.2-.9-2.1-2.1-2.7-3.5L19 3Z"/>
        </svg>
        <span>Sober Social</span>
      </a>
      <div class="meta"><span>Dating Reimagined</span><span aria-hidden="true">•</span><span>Early Access Launch</span></div>
      <button class="join-button" id="join-button" type="button">Join Waitlist</button>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title"><span>Unlock</span> <span>a</span> <span>New</span> <span>World</span> <span>of</span> <span>Connection.</span></h1>
        <p>Dating is broken. We’re rebuilding it from the chemistry up. Get early access before the crowd.</p>
      </div>
      <div class="waitlist" id="waitlist">
        <form class="waitlist-form" id="waitlist-form">
          <label class="sr-status" for="email">Email address</label>
          <input id="email" type="email" autocomplete="email" placeholder="Enter your email" required>
          <button type="submit" id="submit-button">Claim Early Access</button>
        </form>
      </div>
    </section>

    <nav class="controller" id="controller" aria-label="Explore Sober Social">
      <div class="track"></div>
      <div class="capsule"></div>
      <div class="controller-grid">
        <span class="state-label">Select state →</span>
        <button type="button" data-index="1" data-video="video-2">Vibe Check</button>
        <button type="button" data-index="2" data-video="video-3">Smart Match</button>
        <button type="button" data-index="3" data-video="video-1">Real Connections</button>
        <button type="button" data-index="4" data-video="video-4">VIP Access</button>
      </div>
    </nav>
    <div class="sr-status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const controller = document.getElementById('controller');
      const status = document.getElementById('status');
      const buttons = [...controller.querySelectorAll('button')];
      const videos = [...stage.querySelectorAll('video')];
      const form = document.getElementById('waitlist-form');
      const emailInput = document.getElementById('email');
      const submitButton = document.getElementById('submit-button');
      const sceneLabels = { 'video-2': 'Vibe Check', 'video-3': 'Smart Match', 'video-1': 'Real Connections', 'video-4': 'VIP Access' };
      let state = 'base';
      let activeScene = null;
      let locked = false;
      let activeVideo = document.getElementById('video-1');

      const announce = (message) => { status.textContent = message; };
      const setCapsule = (index) => {
        if (index === 0) {
          controller.style.setProperty('--cap-left', '-5px');
          controller.style.setProperty('--cap-width', 'calc(20% + 5px)');
        } else {
          controller.style.setProperty('--cap-left', `${index * 20}%`);
          controller.style.setProperty('--cap-width', '20%');
        }
      };
      const setActiveVideo = (video) => {
        videos.forEach((item) => item.classList.toggle('is-active', item === video));
        activeVideo = video;
      };
      const pauseAtEnd = (video, done) => {
        const hold = () => {
          if (video.duration && video.currentTime >= video.duration - 0.08) {
            video.pause();
            video.removeEventListener('timeupdate', hold);
            done();
          }
        };
        video.addEventListener('timeupdate', hold);
        video.addEventListener('ended', () => { video.pause(); done(); }, { once: true });
      };
      const playSequence = (video, done) => {
        video.currentTime = 0;
        setActiveVideo(video);
        video.play().then(() => pauseAtEnd(video, done)).catch(() => {
          video.pause();
          done();
          announce('The selected scene could not be played.');
        });
      };
      const resetButtons = () => buttons.forEach((button) => {
        button.disabled = false;
        button.classList.remove('is-reset');
        button.textContent = sceneLabels[button.dataset.video];
      });
      const selectScene = (button) => {
        if (locked || activeScene) return;
        locked = true;
        activeScene = button.dataset.video;
        state = 'forward';
        controller.classList.add('is-selected');
        stage.classList.add('title-hidden');
        buttons.forEach((item) => { item.disabled = true; });
        button.classList.add('is-reset');
        button.textContent = 'Reset';
        announce(`Loading ${sceneLabels[activeScene]}.`);
        const video = document.getElementById(activeScene);
        const commit = () => {
          state = 'selected';
          locked = false;
          button.disabled = false;
          announce(`${sceneLabels[activeScene]} selected.`);
        };
        if (video.readyState >= 2) playSequence(video, commit);
        else video.addEventListener('loadeddata', () => playSequence(video, commit), { once: true });
      };
      const resetScene = (button) => {
        if (locked || !activeScene) return;
        locked = true;
        state = 'reverse';
        buttons.forEach((item) => { item.disabled = true; });
        announce(`Resetting ${sceneLabels[activeScene]}.`);
        const video = document.getElementById(`${activeScene}-reverse`);
        const commit = () => {
          controller.classList.remove('is-selected');
          setCapsule(0);
          stage.classList.remove('title-hidden');
          activeScene = null;
          state = 'base';
          locked = false;
          resetButtons();
          setActiveVideo(document.getElementById('video-1'));
          announce('Returned to the base state.');
        };
        if (video.readyState >= 2) playSequence(video, commit);
        else video.addEventListener('loadeddata', () => playSequence(video, commit), { once: true });
      };

      document.getElementById('video-1').addEventListener('loadeddata', (event) => {
        event.currentTarget.currentTime = 0;
        event.currentTarget.play().then(() => event.currentTarget.pause()).catch(() => {});
        announce('Sober Social is ready.');
      }, { once: true });
      buttons.forEach((button) => {
        button.addEventListener('mouseenter', () => { if (!activeScene) setCapsule(Number(button.dataset.index)); });
        button.addEventListener('focus', () => { if (!activeScene) setCapsule(Number(button.dataset.index)); });
        button.addEventListener('click', () => activeScene ? resetScene(button) : selectScene(button));
      });
      controller.addEventListener('mouseleave', () => { if (!activeScene) setCapsule(0); });
      controller.addEventListener('pointermove', (event) => {
        const rect = controller.getBoundingClientRect();
        controller.style.setProperty('--glass-x', `${((event.clientX - rect.left) / rect.width) * 100}%`);
        controller.style.setProperty('--glass-y', `${((event.clientY - rect.top) / rect.height) * 100}%`);
      });
      document.getElementById('join-button').addEventListener('click', () => {
        document.getElementById('waitlist').scrollIntoView({ behavior: 'smooth', block: 'center' });
        window.setTimeout(() => emailInput.focus(), 350);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = emailInput.value.trim().toLowerCase();
        if (!email || !emailInput.checkValidity()) return;
        submitButton.disabled = true;
        submitButton.textContent = 'Sending…';
        announce('Sending your early access request.');
        try {
          const supabaseUrl = 'https://zyeddmxfbolbrmcjvjvc.supabase.co';
          const supabaseAnonKey = window.SOBER_SOCIAL_SUPABASE_ANON_KEY || '';
          if (!supabaseAnonKey) throw new Error('Waitlist service is not configured.');
          const databaseResponse = await fetch(`${supabaseUrl}/rest/v1/waitlist`, {
            method: 'POST',
            headers: { apikey: supabaseAnonKey, Authorization: `Bearer ${supabaseAnonKey}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({ email, created_at: new Date().toISOString() })
          });
          if (!databaseResponse.ok) throw new Error('Could not save your request.');
          const welcomeEndpoint = window.SOBER_SOCIAL_WELCOME_ENDPOINT || `${supabaseUrl}/functions/v1/waitlist-welcome`;
          const emailResponse = await fetch(welcomeEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          if (!emailResponse.ok) throw new Error('Could not send the confirmation email.');
          document.querySelector('.waitlist').innerHTML = '<div class="success-badge" role="status">You’re on the list! Welcome to Sober Social.</div>';
          announce('You’re on the list! Welcome to Sober Social.');
        } catch (error) {
          submitButton.disabled = false;
          submitButton.textContent = 'Claim Early Access';
          const message = error instanceof Error ? error.message : 'Something went wrong. Please try again.';
          const errorElement = document.createElement('div');
          errorElement.className = 'error-message';
          errorElement.setAttribute('role', 'alert');
          errorElement.textContent = message;
          form.insertAdjacentElement('afterend', errorElement);
          window.setTimeout(() => errorElement.remove(), 5000);
          announce(message);
        }
      });
    })();
  </script>
</body>
</html>
