<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unlock a New World of Connection — Dating Reimagined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
      --glass-x: 24%;
      --glass-y: 8%;
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
      --track-left: 0px;
      --track-width: 100%;
      --control-opacity: 1;
      --text: #fff;
      --bg: #000;
      --header-x: 0px;
      --header-y: 0px;
      --panel: rgba(246, 251, 255, 0.24);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(255, 255, 255, 0.2);
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    a, button, input {
      font: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      z-index: 0;
    }

    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
      background: #000;
    }

    .media.visible {
      visibility: visible;
    }

    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 32.9%;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      width: min(901px, calc(100vw - 48px));
      font-size: clamp(52px, 6vw, 88px);
      font-weight: 500;
      line-height: 0.85;
      letter-spacing: -0.04em;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgb(0 0 0 / 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      color: #fff;
      pointer-events: none;
    }

    .title span {
      display: inline-block;
      opacity: 1;
      filter: blur(0);
      transform: translateY(0);
      transition: opacity 900ms var(--retake-ease), filter 900ms var(--retake-ease), transform 900ms var(--retake-ease);
    }

    .title span:nth-child(1) { transition-delay: 0ms; }
    .title span:nth-child(2) { transition-delay: 90ms; }
    .title span:nth-child(3) { transition-delay: 180ms; }
    .title span:nth-child(4) { transition-delay: 270ms; }
    .title span:nth-child(5) { transition-delay: 360ms; }
    .title span:nth-child(6) { transition-delay: 450ms; }

    .stage.title-hidden .title span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-10px);
    }

    .hero-copy {
      position: absolute;
      top: calc(44.78% + 94px);
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      width: min(734px, calc(100vw - 48px));
      font-size: clamp(14px, 1.25vw, 18px);
      line-height: 1.2;
      letter-spacing: -0.04em;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 8px rgb(0 0 0 / 0.16);
      pointer-events: none;
    }

    .waitlist-form {
      position: absolute;
      top: calc(44.78% + 150px);
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      width: min(610px, calc(100vw - 48px));
      display: flex;
      gap: 10px;
      padding: 14px 14px 14px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px) saturate(130%) contrast(110%);
      -webkit-backdrop-filter: blur(14px) saturate(130%) contrast(110%);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
      pointer-events: auto;
      z-index: 12;
      transition: opacity 260ms ease, transform 260ms ease, border-color 260ms ease, background 260ms ease;
    }

    .waitlist-form.success {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(160, 255, 210, 0.7);
    }

    .waitlist-form input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 16px;
      line-height: 1.2;
      padding: 8px 0;
      outline: none;
    }

    .waitlist-form input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .waitlist-form button {
      border: 0;
      background: rgba(255, 255, 255, 0.11);
      color: #fff;
      border-radius: 999px;
      padding: 0 18px;
      height: 42px;
      min-width: 175px;
      font-weight: 600;
      letter-spacing: -0.04em;
      cursor: pointer;
      transition: background 300ms ease, transform 300ms ease, opacity 300ms ease;
    }

    .waitlist-form button:hover,
    .waitlist-form button:focus-visible {
      background: rgba(255, 255, 255, 0.2);
    }

    .waitlist-form button:active {
      transform: translateY(1px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 0;
      padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
      text-shadow: 0 1px 6px rgb(0 0 0 / 0.18);
      pointer-events: none;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: clamp(28px, 3vw, 44px);
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .meta span {
      display: inline-block;
      opacity: 1;
    }

    .join-btn {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 152px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid rgb(255 255 255 / 0.75);
      background: transparent;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      letter-spacing: -0.04em;
      cursor: pointer;
      transition: background 300ms ease, border-color 300ms ease, color 300ms ease, transform 300ms ease;
    }

    .join-btn:hover,
    .join-btn:focus-visible {
      background: #fff;
      color: #0b1a26;
      border-color: rgba(255, 255, 255, 0.95);
    }

    .controller {
      position: absolute;
      top: 46.78%;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      width: min(880px, calc(100vw - 48px));
      height: 72px;
      z-index: 20;
      --glass-x: 24%;
      --glass-y: 8%;
      --cap-left: -5px;
      --cap-width: calc(20% + 5px);
      pointer-events: none;
    }

    .controller .track,
    .controller .capsule {
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    .track {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 64px;
      border-radius: 999px;
      pointer-events: none;
      background: rgb(24 55 82 / 0.31);
      border: 1px solid rgb(255 255 255 / 0.2);
      backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
      box-shadow:
        0 14px 38px rgb(4 24 43 / 0.16),
        0 2px 7px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.48),
        inset -1px -1px 0 rgb(21 49 73 / 0.14),
        inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
      transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 400ms linear 650ms;
    }

    .track::before,
    .track::after,
    .capsule::before,
    .capsule::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .track::before,
    .capsule::before {
      background:
        radial-gradient(120% 150% at var(--glass-x, 24%) var(--glass-y, 8%), rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
        linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
      opacity: 1;
    }

    .track::after,
    .capsule::after {
      padding: 1px;
      background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff, #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.27;
    }

    .capsule {
      top: -1px;
      left: var(--cap-left);
      width: var(--cap-width);
      height: 72px;
      background: rgb(246 251 255 / 0.24);
      border: 1px solid rgb(255 255 255 / 0.28);
      backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
      box-shadow:
        0 11px 28px rgb(4 24 43 / 0.17),
        0 2px 6px rgb(4 24 43 / 0.1),
        inset 1px 1px 0 rgb(255 255 255 / 0.62),
        inset -1px -1px 0 rgb(20 49 73 / 0.18),
        inset 0 0 12px rgb(255 255 255 / 0.055);
      transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease), background 620ms var(--retake-ease), opacity 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
      pointer-events: none;
      will-change: left, width, transform;
    }

    .capsule::after {
      opacity: 0.30;
    }

    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      pointer-events: auto;
      z-index: 2;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 0 14px;
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: -0.04em;
      white-space: nowrap;
      text-align: center;
      color: rgba(255, 255, 255, 0.96);
      opacity: 1;
      filter: blur(0);
      transform: scale(1) translateY(0);
      transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease), text-shadow 420ms ease;
    }

    .static-label {
      opacity: 1;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.9);
    }

    .control-btn {
      background: transparent;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      color: inherit;
      font-weight: 400;
      transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease), background 420ms ease, color 420ms ease, text-decoration-color 420ms ease;
    }

    .control-btn:hover,
    .control-btn:focus-visible {
      background: rgba(255, 255, 255, 0.02);
    }

    .control-btn.reset {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
      text-decoration-color: rgba(255, 255, 255, 0.8);
      opacity: 1;
    }

    .stage.is-hovering .static-label,
    .stage.is-selected .static-label {
      opacity: 0.5;
      transition-duration: 300ms;
    }

    .stage.is-transitioning .cell,
    .stage.is-resetting .cell,
    .stage.is-working .cell {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
      pointer-events: auto;
    }

    .control-btn.active {
      color: #0b1a26;
      background: rgba(246, 251, 255, 0.78);
      box-shadow: 0 5px 16px rgba(4, 24, 43, 0.16);
    }

    .control-btn.vip-trigger {
      position: relative;
      overflow: visible;
    }

    .control-btn.vip-trigger:hover,
    .control-btn.vip-trigger:focus-visible,
    .stage.vip-engaged .control-btn.vip-trigger {
      color: #fff;
      text-shadow: 0 0 16px rgba(190, 239, 255, 0.9);
    }

    .stage.vip-engaged .capsule {
      box-shadow:
        0 11px 28px rgb(4 24 43 / 0.17),
        0 0 28px rgba(145, 226, 255, 0.48),
        inset 1px 1px 0 rgb(255 255 255 / 0.72),
        inset -1px -1px 0 rgb(20 49 73 / 0.18),
        inset 0 0 18px rgba(255, 255, 255, 0.12);
      animation: vip-pulse 1800ms ease-in-out infinite;
    }

    .vip-prompt {
      position: absolute;
      top: calc(100% + 18px);
      left: 80%;
      z-index: 4;
      width: max-content;
      max-width: min(270px, calc(100vw - 48px));
      padding: 10px 15px;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.96);
      background: rgba(18, 39, 56, 0.62);
      backdrop-filter: blur(14px) saturate(135%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      box-shadow: 0 12px 30px rgba(4, 24, 43, 0.24), 0 0 24px rgba(127, 227, 255, 0.16);
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translate(-50%, -8px) scale(0.94);
      pointer-events: none;
      transition: opacity 360ms var(--retake-ease), transform 520ms var(--retake-ease);
    }

    .vip-prompt::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      width: 9px;
      height: 9px;
      background: rgba(18, 39, 56, 0.8);
      border-top: 1px solid rgba(255, 255, 255, 0.34);
      border-left: 1px solid rgba(255, 255, 255, 0.34);
      transform: translateX(-50%) rotate(45deg);
    }

    .stage.vip-engaged .vip-prompt {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    @keyframes vip-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }

    .stage.is-hidden .track {
      opacity: 0;
    }

    .stage.is-collapsing .track {
      left: calc(50% - 96px);
      width: 192px;
      transition-duration: 980ms;
    }

    .stage.is-collapsing .capsule {
      left: calc(50% - 100px);
      width: 200px;
      background: rgb(246 251 255 / 0.14);
      transition-duration: 980ms;
    }

    .stage.is-resetting .track {
      opacity: 1;
      transition-delay: 0ms;
    }

    .status,
    .notice {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: opacity 240ms ease;
    }

    .status {
      top: 120px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
    }

    .notice {
      bottom: 42px;
      font-size: 12px;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(17, 35, 49, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 10px 16px;
      width: auto;
    }

    .stage.is-visible-status .status,
    .stage.is-visible-notice .notice {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .header {
        padding: calc(24px + env(safe-area-inset-top)) 24px 24px;
      }

      .meta {
        margin-left: 34px;
        gap: 22px;
        font-size: 14px;
      }

      .join-btn {
        width: 116px;
        height: 36px;
        font-size: 14px;
      }

      .cell {
        font-size: clamp(16px, 2.2vw, 22px);
      }
    }

    @media (max-width: 700px) {
      .header {
        padding-left: 18px;
        padding-right: 18px;
      }

      .meta {
        min-width: 0;
        gap: 12px;
        font-size: 12px;
      }

      .meta span {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .join-btn {
        width: 92px;
        height: 34px;
        font-size: 13px;
      }

      .title {
        top: 32%;
        width: calc(100vw - 40px);
        font-size: clamp(42px, 12vw, 58px);
        line-height: 0.9;
        white-space: normal;
      }

      .hero-copy {
        top: 75%;
        width: calc(100vw - 44px);
        font-size: 14px;
      }

      .waitlist-form {
        top: calc(75% + 34px);
        width: calc(100vw - 40px);
        flex-direction: column;
        border-radius: 24px;
        padding: 12px 12px 12px 14px;
      }

      .waitlist-form button {
        width: 100%;
        min-width: 0;
      }

      .controller {
        top: 53%;
        width: calc(100vw - 40px);
        height: 156px;
      }

      .track {
        top: 0;
        height: 156px;
        border-radius: 28px;
      }

      .cells {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: 48px 54px 54px;
      }

      .static-label {
        grid-column: 1 / -1;
      }

      .cell {
        font-size: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      .cell:not(.static-label):nth-child(2),
      .cell:not(.static-label):nth-child(3) {
        border-top: 0;
      }

      .controller .capsule {
        opacity: 0;
        pointer-events: none;
      }

      .vip-prompt {
        top: calc(100% + 10px);
        left: 75%;
        max-width: calc(100vw - 48px);
        text-align: center;
      }

      .control-btn.active {
        color: #fff;
        background: rgba(246, 251, 255, 0.2);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34);
      }

      .stage.is-collapsing .capsule,
      .stage.is-selected .capsule,
      .stage.is-resetting .capsule {
        opacity: 1;
        left: var(--cap-left);
        top: -1px;
        -webkit-transform: none;
        transform: none;
        width: var(--cap-width);
        height: 72px;
        border-radius: 999px;
        background: rgb(246 251 255 / 0.24);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
        filter: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage title-hidden" id="stage">
    <video class="media visible" id="video-1" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-1.mp4"></video>
    <video class="media" id="video-1-reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-1-reverse.mp4"></video>
    <video class="media" id="video-2" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-2.mp4"></video>
    <video class="media" id="video-2-reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-2-reverse.mp4"></video>
    <video class="media" id="video-3" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-3.mp4"></video>
    <video class="media" id="video-3-reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-3-reverse.mp4"></video>
    <video class="media" id="video-4" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-4.mp4"></video>
    <video class="media" id="video-4-reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-80498b2e408f4eef9c7e26871bd9bf65.r2.dev/video-4-reverse.mp4"></video>

    <div class="hero">
      <h1 class="title" aria-label="Unlock a New World of Connection.">
        <span>Unlock</span>
        <span>a</span>
        <span>New</span>
        <span>World</span>
        <span>of</span>
        <span>Connection.</span>
      </h1>
      <p class="hero-copy">Dating is broken. We’re rebuilding it from the chemistry up. Get early access before the crowd.</p>
      <form class="waitlist-form" id="waitlist-form" novalidate>
        <label class="sr-only" for="email-input">Email address</label>
        <input id="email-input" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" required>
        <button type="submit">Claim Early Access</button>
      </form>
    </div>

    <div class="controller glass" id="controller" aria-label="Feature state controller" role="group">
      <div class="track"></div>
      <div class="capsule" id="capsule"></div>
      <div class="cells" aria-hidden="false">
        <div class="cell static-label">Select state →</div>
        <button class="cell control-btn" type="button" data-scene="vibeCheck">Vibe Check</button>
        <button class="cell control-btn" type="button" data-scene="smartMatch">Smart Match</button>
        <button class="cell control-btn" type="button" data-scene="realConnections">Real Connections</button>
        <button class="cell control-btn vip-trigger" type="button" data-scene="vipAccess" aria-describedby="vip-prompt">VIP Access</button>
      </div>
      <div class="vip-prompt" id="vip-prompt" role="status">Join waiting list for VIP access</div>
    </div>

    <header class="header">
      <div class="meta" aria-label="Brand metadata">
        <span>Dating Reimagined</span>
      </div>
      <button type="button" class="join-btn" id="join-waitlist">Join Waitlist</button>
    </header>

    <div class="status" id="status" aria-live="polite">Ready</div>
    <div class="notice" id="notice" aria-live="polite">A new era of connection is opening.</div>
    <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var waitlistForm = document.getElementById('waitlist-form');
      var emailInput = document.getElementById('email-input');
      var joinButton = document.getElementById('join-waitlist');
      var status = document.getElementById('status');
      var notice = document.getElementById('notice');
      var liveRegion = document.getElementById('live-region');
      var controller = document.getElementById('controller');
      var capsule = document.getElementById('capsule');
      var labelButtons = Array.prototype.slice.call(document.querySelectorAll('.control-btn'));
      var mediaEls = Array.prototype.slice.call(document.querySelectorAll('.media'));
      var vipButton = document.querySelector('[data-scene="vipAccess"]');
      var vipPrompt = document.getElementById('vip-prompt');
      var vipPinned = false;
      var supabaseUrl = 'https://zyeddmxfbolbrmcjvjvc.supabase.co';
      var waitlistFunctionUrl = supabaseUrl + '/functions/v1/waitlist-welcome';
      var supabaseAnonKey =  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5ZWRkbXhmYm9sYnJtY2p2anZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzM3NjAsImV4cCI6MjEwNTA0OTc2MH0.ccVuLTOQtOmu-y9I4xCeW1b91dPGb3CRZfiooPGNiSc';

      var sceneMeta = {
        base: { name: 'base', visibleId: 'video-1', forwardId: null, reverseId: null, duration: 0 },
        vibeCheck: { name: 'vibeCheck', visibleId: 'video-2', forwardId: 'video-2', reverseId: 'video-2-reverse', duration: 2.08, terminalHold: 0.08, reverseHold: 0.18 },
        smartMatch: { name: 'smartMatch', visibleId: 'video-3', forwardId: 'video-3', reverseId: 'video-3-reverse', duration: 2.08, terminalHold: 0.08, reverseHold: 0.08 },
        realConnections: { name: 'realConnections', visibleId: 'video-1', forwardId: 'video-1', reverseId: 'video-1-reverse', duration: 2.08, terminalHold: 0.08, reverseHold: 0.08 },
        vipAccess: { name: 'vipAccess', visibleId: 'video-4', forwardId: 'video-4', reverseId: 'video-4-reverse', duration: 3, terminalHold: 0.08, reverseHold: 0.08 }
      };

      var state = {
        scene: 'base',
        playback: 'loading',
        direction: 'forward',
        locked: false,
        selectedScene: null,
        activeVideo: 'video-1',
        pendingTarget: null,
        pendingIsBase: false,
        transitionId: 0
      };

      var buttonByScene = {};
      labelButtons.forEach(function (button) {
        buttonByScene[button.dataset.scene] = button;
      });

      function announce(message) {
        if (!liveRegion) return;
        liveRegion.textContent = message;
      }

      function setNotice(message) {
        if (notice) {
          notice.textContent = message;
        }
      }

      function setStatus(message) {
        if (status) {
          status.textContent = message;
        }
      }

      function setVipEngaged(engaged) {
        stage.classList.toggle('vip-engaged', engaged);
        if (vipPrompt) {
          vipPrompt.style.opacity = engaged ? '1' : '0';
          vipPrompt.style.transform = engaged ? 'translate(-50%, 0) scale(1)' : 'translate(-50%, -8px) scale(.94)';
        }
      }

      function setVisibleVideo(videoId) {
        mediaEls.forEach(function (videoEl) {
          var isVisible = videoEl.id === videoId;
          videoEl.classList.toggle('visible', isVisible);
          if (isVisible) {
            videoEl.style.visibility = 'visible';
          } else {
            videoEl.style.visibility = 'hidden';
          }
        });
      }

      function getVideoById(id) {
        return document.getElementById(id);
      }

      function pauseAllBut(id) {
        mediaEls.forEach(function (videoEl) {
          if (videoEl.id !== id) {
            videoEl.pause();
          }
        });
      }

      function applyCapsulePosition(left, width) {
        capsule.style.setProperty('--cap-left', left);
        capsule.style.setProperty('--cap-width', width);
      }

      function resetTrackPosition() {
        capsule.style.setProperty('--cap-left', '-5px');
        capsule.style.setProperty('--cap-width', 'calc(20% + 5px)');
      }

      function updateControllerSelection(targetScene) {
        Object.keys(buttonByScene).forEach(function (sceneKey) {
          var button = buttonByScene[sceneKey];
          button.classList.toggle('active', !!targetScene && sceneKey === targetScene);
        });
        setVipEngaged(targetScene === 'vipAccess' || vipPinned);
      }

      function updateStaticLabelState() {
        var selected = state.selectedScene && state.scene === state.selectedScene;
        stage.classList.toggle('is-selected', !!selected);
        stage.classList.toggle('is-hovering', false);
      }

      function setTitleHidden(hidden) {
        stage.classList.toggle('title-hidden', !!hidden);
      }

      function setupInitialBaseVideo() {
        var baseVideo = getVideoById('video-1');
        if (!baseVideo) return;
        baseVideo.muted = true;
        baseVideo.playsInline = true;
        baseVideo.setAttribute('playsinline', 'true');
        baseVideo.pause();
        baseVideo.currentTime = 0;
        setVisibleVideo('video-1');
        state.activeVideo = 'video-1';
        state.playback = 'ready';
        state.scene = 'base';
        state.selectedScene = null;
        setTitleHidden(false);
        updateControllerSelection(null);
        setNotice('A new era of connection is opening.');
      }

      function setControlDisabled(disabled) {
        labelButtons.forEach(function (button) {
          button.disabled = disabled;
          button.style.pointerEvents = 'auto';
        });
      }

      function setButtonStylesByScene() {
        Object.keys(buttonByScene).forEach(function (sceneKey) {
          var button = buttonByScene[sceneKey];
          var label = sceneKey === 'vibeCheck' ? 'Vibe Check' : sceneKey === 'smartMatch' ? 'Smart Match' : sceneKey === 'realConnections' ? 'Real Connections' : 'VIP Access';
          sceneMeta[sceneKey].label = label;
          button.textContent = label;
        });
      }

      function ensureCurrentTimeZero(videoEl, callback) {
        if (!videoEl) return callback();
        var onSeeked = function () {
          videoEl.removeEventListener('seeked', onSeeked);
          callback();
        };

        if (videoEl.readyState >= 2 && Math.abs(videoEl.currentTime) <= 0.001) {
          return callback();
        }

        videoEl.addEventListener('seeked', onSeeked, { once: true });
        videoEl.currentTime = 0;
      }

      function beginTransition(sceneKey) {
        if (state.scene === sceneKey && state.playback !== 'starting') {
          return;
        }

        var targetVideoId = sceneMeta[sceneKey].forwardId;
        var targetVideo = getVideoById(targetVideoId);
        var currentVideo = getVideoById(state.activeVideo || 'video-1');

        if (!targetVideo) return;

        var transitionId = state.transitionId + 1;
        state.transitionId = transitionId;
        state.locked = true;
        state.selectedScene = sceneKey;
        state.direction = 'forward';
        state.playback = 'starting';
        state.pendingTarget = sceneKey;
        setControlDisabled(false);
        stage.classList.add('is-transitioning');
        stage.classList.remove('is-resetting', 'is-collapsing', 'is-selected', 'is-working');
        setTitleHidden(sceneKey !== 'base');
        setNotice('Transitioning into ' + sceneMeta[sceneKey].label + '.');
        announce('Opening ' + sceneMeta[sceneKey].label + ' scene.');
        updateControllerSelection(sceneKey);
        applyCapsulePosition(
          sceneKey === 'vibeCheck' ? '20%' :
          sceneKey === 'smartMatch' ? '40%' :
          sceneKey === 'realConnections' ? '60%' : '80%',
          '20%'
        );

        if (currentVideo && currentVideo !== targetVideo) {
          currentVideo.pause();
        }

        var finish = false;
        var finishTransition = function () {
          if (finish || transitionId !== state.transitionId) return;
          finish = true;
          targetVideo.pause();
          if (targetVideo.duration && targetVideo.currentTime < targetVideo.duration - 0.12) {
            targetVideo.currentTime = Math.max(0, targetVideo.duration - 0.12);
          }
          state.scene = sceneKey;
          state.activeVideo = targetVideoId;
          state.locked = false;
          state.playback = 'ready';
          stage.classList.remove('is-transitioning', 'is-working');
          stage.classList.add('is-selected');
          setControlDisabled(false);
          setStatus('Selected');
          setNotice(sceneMeta[sceneKey].label + ' selected.');
          announce('Selected ' + sceneMeta[sceneKey].label + '.');
        };

        ensureCurrentTimeZero(targetVideo, function () {
          targetVideo.pause();
          targetVideo.muted = true;
          setVisibleVideo(targetVideoId);
          state.activeVideo = targetVideoId;
          var timer = window.setTimeout(finishTransition, ((sceneMeta[sceneKey].duration || 2.1) + 0.35) * 1000);
          var onEnded = function () {
            window.clearTimeout(timer);
            targetVideo.removeEventListener('ended', onEnded);
            finishTransition();
          };
          targetVideo.addEventListener('ended', onEnded);
          targetVideo.play().then(function () {
            if (transitionId !== state.transitionId) return;
            state.playback = 'playing';
            setStatus('Playing');
            stage.classList.add('is-working');
          }).catch(function () {
            if (transitionId !== state.transitionId) return;
            window.clearTimeout(timer);
            targetVideo.removeEventListener('ended', onEnded);
            targetVideo.load();
            setStatus('Ready');
            setNotice('Tap a feature to try again.');
            announce('Playback could not start.');
            state.locked = false;
            state.playback = 'ready';
            stage.classList.remove('is-transitioning', 'is-working');
          });
        });
      }

      function completeSelectedState(sceneKey) {
        return;
      }

      function handleMouseMove(event) {
        var rect = controller.getBoundingClientRect();
        var x = ((event.clientX - rect.left) / rect.width) * 100;
        var y = ((event.clientY - rect.top) / rect.height) * 100;
        controller.style.setProperty('--glass-x', Math.min(100, Math.max(0, x)) + '%');
        controller.style.setProperty('--glass-y', Math.min(100, Math.max(0, y)) + '%');
      }

      controller.addEventListener('pointermove', handleMouseMove);
      controller.addEventListener('pointerenter', function () {
        stage.classList.add('is-hovering');
      });
      controller.addEventListener('pointerleave', function () {
        if (!state.selectedScene) {
          stage.classList.remove('is-hovering');
        }
        if (!vipPinned) {
          setVipEngaged(false);
        }
      });

      labelButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var sceneKey = button.dataset.scene;
          vipPinned = sceneKey === 'vipAccess';
          beginTransition(sceneKey);
        });
      });

      if (vipButton) {
        vipButton.addEventListener('pointerenter', function () {
          setVipEngaged(true);
        });
        vipButton.addEventListener('focus', function () {
          setVipEngaged(true);
        });
        vipButton.addEventListener('blur', function () {
          if (!vipPinned) {
            setVipEngaged(false);
          }
        });
      }

      joinButton.addEventListener('click', function () {
        emailInput.focus();
        emailInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });

      waitlistForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var email = emailInput.value.trim();
        if (!email || !email.includes('@')) {
          announce('Please enter a valid email address.');
          emailInput.focus();
          return;
        }

        var submitButton = waitlistForm.querySelector('button');
        submitButton.disabled = true;
        submitButton.textContent = 'Joining…';
        announce('Submitting your email.');

        fetch(waitlistFunctionUrl, {
          method: 'POST',
          headers: {
            'apikey': supabaseAnonKey,
            'Authorization': 'Bearer ' + supabaseAnonKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email })
        }).then(function (response) {
          if (!response.ok) {
            return response.text().then(function (details) {
              var error = new Error('Waitlist request failed with status ' + response.status);
              error.details = details;
              throw error;
            });
          }

          waitlistForm.classList.add('success');
          submitButton.textContent = 'You’re on the list!';
          announce('You are on the list.');
          setNotice('You’re on the list!');
        }).catch(function (error) {
          submitButton.disabled = false;
          submitButton.textContent = 'Claim Early Access';
          if (error && error.message.indexOf('status 409') !== -1) {
            announce('This email is already on the list.');
            setNotice('You’re already on the list.');
          } else {
            announce('We could not save your email. Please try again.');
            setNotice('Something went wrong. Please try again.');
          }
          if (window.console && window.console.error) {
            window.console.error('Waitlist submission failed.', error);
          }
        });
      });

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          setStatus('Paused');
        } else if (state.scene === 'base') {
          setStatus('Ready');
        }
      });

      setButtonStylesByScene();
      setupInitialBaseVideo();
      setControlDisabled(false);
      setStatus('Ready');
      setNotice('A new era of connection is opening.');
      announce('Page ready.');
    }());
  </script>
</body>
</html>
