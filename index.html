<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sober Social — Dating Reimagined</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --retake-ease: cubic-bezier(0.16, 1, 0.3, 1);
      --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);

      --color-terracotta: #C46231;
      --color-terracotta-hover: #D86F3A;
      --color-linen: #F5EFE0;
      
      /* Crystal Glass Palette */
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-bg-track: rgba(18, 11, 8, 0.45);
      --glass-bg-capsule: rgba(196, 98, 49, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: rgba(196, 98, 49, 0.4);
      color: var(--color-linen);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080504;
      color: var(--color-linen);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #080504;
    }

    /* Video Media Layers */
    .media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
      visibility: hidden;
    }

    .media.active {
      visibility: visible;
    }

    /* Vignette Gradient for Readability */
    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.55) 100%),
                  linear-gradient(to bottom, rgba(8, 5, 4, 0.6) 0%, transparent 25%, transparent 75%, rgba(8, 5, 4, 0.8) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Header */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(28px + env(safe-area-inset-top)) 48px 0;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .brand-title {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.12em;
      color: var(--color-linen);
      text-transform: uppercase;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 32px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.7);
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 24px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--color-linen);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: all 300ms var(--retake-ease);
    }

    .btn-header:hover {
      background: var(--color-terracotta);
      border-color: var(--color-terracotta);
      box-shadow: 0 4px 20px rgba(196, 98, 49, 0.35);
    }

    /* Hero Typography */
    .hero {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-wrapper {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, calc(100vw - 40px));
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(44px, 5.2vw, 84px);
      font-weight: 500;
      line-height: 1.02;
      letter-spacing: -0.03em;
      text-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
    }

    h1 span {
      display: inline-block;
      transition: opacity 800ms var(--retake-ease), filter 800ms var(--retake-ease), transform 800ms var(--retake-ease);
    }

    .stage.title-hidden h1 span {
      opacity: 0;
      filter: blur(12px);
      transform: translateY(-12px);
    }

    /* Compact Elegant Waitlist Form */
    .waitlist-form-container {
      position: absolute;
      bottom: 125px;
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, calc(100vw - 40px));
      pointer-events: auto;
      z-index: 25;
    }

    .waitlist-form {
      display: flex;
      align-items: center;
      padding: 4px 4px 4px 18px;
      border-radius: 999px;
      background: rgba(18, 11, 8, 0.4);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: border-color 300ms var(--retake-ease), box-shadow 300ms var(--retake-ease);
    }

    .waitlist-form:focus-within {
      border-color: rgba(196, 98, 49, 0.8);
      box-shadow: 0 20px 40px rgba(196, 98, 49, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .waitlist-input {
      flex: 1;
      background: transparent;
      border: none;
      font-family: 'Manrope', sans-serif;
      font-size: 14px;
      color: var(--color-linen);
      outline: none;
    }

    .waitlist-input::placeholder {
      color: rgba(245, 239, 224, 0.45);
    }

    .waitlist-submit {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      background: var(--color-terracotta);
      color: var(--color-linen);
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 250ms var(--retake-ease), transform 150ms var(--retake-ease);
      white-space: nowrap;
    }

    .waitlist-submit:hover {
      background: var(--color-terracotta-hover);
      transform: scale(1.02);
    }

    .waitlist-message {
      display: none;
      text-align: center;
      padding: 12px 24px;
      border-radius: 999px;
      background: rgba(18, 11, 8, 0.8);
      border: 1px solid var(--color-terracotta);
      color: var(--color-linen);
      font-size: 14px;
      font-weight: 600;
      backdrop-filter: blur(20px);
    }

    .waitlist-message.active {
      display: block;
      animation: fadeIn 400ms var(--retake-ease);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Glass Bottom Controller */
    .controller {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: min(840px, calc(100vw - 40px));
      height: 56px;
      z-index: 20;
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: var(--glass-bg-track);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 800ms var(--retake-slow-ease);
    }

    .capsule {
      position: absolute;
      top: 3px;
      bottom: 3px;
      border-radius: 999px;
      left: var(--cap-left, 3px);
      width: var(--cap-width, calc(20% - 3px));
      background: var(--glass-bg-capsule);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: left 500ms var(--retake-ease), width 500ms var(--retake-ease);
      pointer-events: none;
    }

    .cells {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      background: transparent;
      border: none;
      color: var(--color-linen);
      cursor: pointer;
      transition: opacity 300ms var(--retake-ease);
    }

    .cell-label {
      cursor: default;
      opacity: 0.5;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Collapsed Controller State */
    .stage.collapsed .track {
      left: calc(50% - 90px);
      width: 180px;
      opacity: 0;
    }

    .stage.collapsed .capsule {
      left: calc(50% - 90px) !important;
      width: 180px !important;
      background: rgba(18, 11, 8, 0.85);
      border-color: var(--color-terracotta);
    }

    .stage.collapsed .cell {
      opacity: 0;
      pointer-events: none;
    }

    .stage.collapsed .cell.active-chosen {
      opacity: 1;
      position: absolute;
      left: 50%;
      top: 0;
      width: 180px;
      height: 56px;
      transform: translateX(-50%);
      pointer-events: auto;
      color: var(--color-terracotta);
      font-weight: 700;
    }

    /* Mobile Adjustments */
    @media (max-width: 768px) {
      header { padding: 20px 24px 0; }
      .meta { display: none; }
      h1 { font-size: clamp(36px, 8vw, 48px); }
      .title-wrapper { top: 12%; }
      .waitlist-form-container { bottom: 100px; }
      .controller { bottom: 24px; height: 110px; }
      .cells { grid-template-columns: repeat(2, 1fr); }
      .cell-label { grid-column: 1 / -1; }
      .capsule { display: none; }
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">

    <!-- 8 Persistent R2 Remote Video Streams -->
    <video id="vid-real-fwd" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4"></video>
    <video id="vid-real-rev" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4"></video>
    <video id="vid-vibe-fwd" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4"></video>
    <video id="vid-vibe-rev" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4"></video>
    <video id="vid-match-fwd" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4"></video>
    <video id="vid-match-rev" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4"></video>
    <video id="vid-vip-fwd" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4"></video>
    <video id="vid-vip-rev" class="media" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4"></video>

    <!-- Navigation -->
    <header>
      <a href="#" class="brand">
        <svg width="28" height="24" viewBox="0 0 40 34" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 2H20L12 18H4V2Z" fill="#F5EFE0"/>
          <path d="M12 18V30M6 30H18" stroke="#F5EFE0" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M36 2H20L28 18H36V2Z" fill="#C46231"/>
          <path d="M28 18V30M22 30H34" stroke="#C46231" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">Sober Social</span>
      </a>
      
      <div class="meta">
        <span>Dating Reimagined</span>
        <span>•</span>
        <span>Early Access</span>
      </div>

      <a href="#waitlist" class="btn-header" id="btn-header-join">Join Waitlist</a>
    </header>

    <!-- Hero Title -->
    <main class="hero">
      <div class="title-wrapper">
        <h1>
          <span>Unlock</span> <span>a</span> <span>New</span> <span>World</span> <span>of</span> <span>Connection.</span>
        </h1>
      </div>

      <div class="waitlist-form-container" id="waitlist">
        <form class="waitlist-form" id="waitlist-form">
          <input type="email" required placeholder="Enter your email" class="waitlist-input" id="waitlist-email" />
          <button type="submit" class="waitlist-submit" id="waitlist-btn">Get Access</button>
        </form>
        <div class="waitlist-message" id="waitlist-message"></div>
      </div>
    </main>

    <!-- Controller Bar -->
    <nav class="controller" id="controller">
      <div class="track"></div>
      <div class="capsule" id="capsule"></div>
      <div class="cells">
        <div class="cell cell-label">Select state →</div>
        <button class="cell" data-index="1" data-key="vibeCheck">Vibe Check</button>
        <button class="cell" data-index="2" data-key="smartMatch">Smart Match</button>
        <button class="cell" data-index="3" data-key="realConnections">Real Connections</button>
        <button class="cell" data-index="4" data-key="vipAccess">VIP Access</button>
      </div>
    </nav>

  </div>

  <script>
    (function () {
      'use strict';

      var mediaMap = {
        vibeCheck: { fwd: document.getElementById('vid-vibe-fwd'), rev: document.getElementById('vid-vibe-rev'), fwdHold: 0.08, revHold: 0.18 },
        smartMatch: { fwd: document.getElementById('vid-match-fwd'), rev: document.getElementById('vid-match-rev'), fwdHold: 0.08, revHold: 0.08 },
        realConnections: { fwd: document.getElementById('vid-real-fwd'), rev: document.getElementById('vid-real-rev'), fwdHold: 0.08, revHold: 0.08 },
        vipAccess: { fwd: document.getElementById('vid-vip-fwd'), rev: document.getElementById('vid-vip-rev'), fwdHold: 0.08, revHold: 0.08 }
      };

      var stage = document.getElementById('stage');
      var controller = document.getElementById('controller');
      var capsule = document.getElementById('capsule');
      var buttons = document.querySelectorAll('.cell[data-key]');
      var form = document.getElementById('waitlist-form');
      var emailInput = document.getElementById('waitlist-email');
      var submitBtn = document.getElementById('waitlist-btn');
      var messageBox = document.getElementById('waitlist-message');

      var currentState = {
        scene: 'base',
        busy: false,
        activeVid: mediaMap.realConnections.fwd
      };

      currentState.activeVid.classList.add('active');
      currentState.activeVid.currentTime = 0;

      function setCapsulePos(index) {
        var positions = [
          { left: '3px', width: 'calc(20% - 3px)' },
          { left: '20%', width: '20%' },
          { left: '40%', width: '20%' },
          { left: '60%', width: '20%' },
          { left: '80%', width: 'calc(20% - 3px)' }
        ];
        var pos = positions[index] || positions[0];
        capsule.style.setProperty('--cap-left', pos.left);
        capsule.style.setProperty('--cap-width', pos.width);
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('mouseenter', function () {
          if (currentState.scene === 'base' && !currentState.busy) {
            setCapsulePos(parseInt(btn.getAttribute('data-index'), 10));
          }
        });
      });

      controller.addEventListener('mouseleave', function () {
        if (currentState.scene === 'base' && !currentState.busy) {
          setCapsulePos(0);
        }
      });

      function playTransition(key, isReverse) {
        if (currentState.busy) return;
        currentState.busy = true;

        var map = mediaMap[key];
        var targetVid = isReverse ? map.rev : map.fwd;
        var holdTime = isReverse ? map.revHold : map.fwdHold;

        targetVid.currentTime = 0;

        targetVid.play().then(function () {
          currentState.activeVid.classList.remove('active');
          currentState.activeVid.pause();

          targetVid.classList.add('active');
          currentState.activeVid = targetVid;

          if (!isReverse) {
            stage.classList.add('title-hidden');
            stage.classList.add('collapsed');
          } else {
            stage.classList.remove('collapsed');
          }

          var checkHold = setInterval(function () {
            if (targetVid.duration && (targetVid.duration - targetVid.currentTime) <= holdTime) {
              targetVid.pause();
              clearInterval(checkHold);
              currentState.busy = false;

              if (isReverse) {
                currentState.scene = 'base';
                stage.classList.remove('title-hidden');
                setCapsulePos(0);
                buttons.forEach(function (b) {
                  b.classList.remove('active-chosen');
                  b.textContent = b.getAttribute('data-original-text') || b.textContent;
                });
              } else {
                currentState.scene = key;
              }
            }
          }, 30);

        }).catch(function (err) {
          console.error(err);
          currentState.busy = false;
        });
      }

      buttons.forEach(function (btn) {
        btn.setAttribute('data-original-text', btn.textContent);
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-key');
          if (currentState.scene === 'base') {
            btn.classList.add('active-chosen');
            btn.textContent = '✕ Reset';
            playTransition(key, false);
          } else if (currentState.scene === key) {
            playTransition(key, true);
          }
        });
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        if (!email) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Joining...';

        setTimeout(function() {
          form.style.display = 'none';
          messageBox.textContent = "You're on the list! Welcome.";
          messageBox.classList.add('active');
        }, 600);
      });

    })();
  </script>
</body>
</html>
